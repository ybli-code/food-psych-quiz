<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心晴心理测评</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #FFF5EB 0%, #FFE8D6 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .app { width: 100%; max-width: 420px; }
  .header { text-align: center; margin-bottom: 35px; }
  .header h1 { font-size: 32px; font-weight: 900; color: #2D1B14; margin-bottom: 8px; }
  .header p { font-size: 15px; color: #999; }
  .list { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    text-decoration: none;
    color: inherit;
    transition: transform .15s;
  }
  .card:active { transform: scale(0.98); }
  .card-icon {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .card:nth-child(1) .card-icon { background: #FFF0E5; }
  .card:nth-child(2) .card-icon { background: #DCEAFB; }
  .card:nth-child(3) .card-icon { background: #E2F4DC; }
  .card-info { flex: 1; }
  .card-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .card-desc { font-size: 13px; color: #999; }
  .card-arrow { color: #ccc; font-size: 20px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>心晴心理测评</h1>
    <p>多个趣味小测试，选一个开始吧</p>
  </div>
  <div class="list">
    <a class="card" href="index.html">
      <div class="card-icon">🍜</div>
      <div class="card-info">
        <div class="card-name">美食心理测试</div>
        <div class="card-desc">8道题，看看你最爱的盖饭是哪款</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card" href="dialect.html">
      <div class="card-icon">🗣️</div>
      <div class="card-info">
        <div class="card-name">山东方言大测试</div>
        <div class="card-desc">纯方言版，测测你是山东哪个市人</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card" href="mbti.html">
      <div class="card-icon">🧠</div>
      <div class="card-info">
        <div class="card-name">MBTI人格测试</div>
        <div class="card-desc">28题测出你的人格类型，16型详解</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>
</div>
</body>
</html>
