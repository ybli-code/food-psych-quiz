// ========== 游戏逻辑 ==========
var candidates = [];
var usedQuestions = [];
var currentQIndex = 0;
var totalQuestions = 7;

function showView(id) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  candidates = ALL_CITIES.slice();
  usedQuestions = [];
  currentQIndex = 0;
  totalQuestions = 6 + Math.floor(Math.random() * 3); // 6-8题随机
  renderQuestion();
  showView('view-quiz');
}

// 从未用题中选一道"区分度最高"的题
function pickQuestion() {
  var best = null;
  var bestScore = -1;
  var unused = [];
  for (var i = 0; i < bank.length; i++) {
    if (usedQuestions.indexOf(i) === -1) unused.push(i);
  }
  // 打乱顺序
  for (var i = unused.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = unused[i]; unused[i] = unused[j]; unused[j] = tmp;
  }
  // 从随机顺序里找最好的（前10个候选里选）
  var checkCount = Math.min(10, unused.length);
  for (var k = 0; k < checkCount; k++) {
    var idx = unused[k];
    var q = bank[idx];
    // 计算这道题对当前candidates的区分度
    var score = 0;
    for (var o = 0; o < q.options.length; o++) {
      var overlap = 0;
      for (var c = 0; c < q.options[o].cities.length; c++) {
        if (candidates.indexOf(q.options[o].cities[c]) !== -1) overlap++;
      }
      // 希望每个选项覆盖的candidates数量适中
      if (overlap > 0 && overlap < candidates.length) score++;
    }
    if (score > bestScore) { bestScore = score; best = idx; }
  }
  if (best === null && unused.length > 0) best = unused[0];
  return best;
}

function renderQuestion() {
  if (currentQIndex >= totalQuestions || candidates.length <= 1) {
    showResult();
    return;
  }
  var qIdx = pickQuestion();
  if (qIdx === null) { showResult(); return; }
  usedQuestions.push(qIdx);
  var q = bank[qIdx];

  document.getElementById('qTag').textContent = "第 " + (currentQIndex + 1) + " 题 / 共 " + totalQuestions + " 题";
  document.getElementById('qEmoji').textContent = q.emoji;
  document.getElementById('qText').textContent = q.q;

  var pct = ((currentQIndex + 1) / totalQuestions) * 100;
  document.getElementById('progressFill').style.width = pct + '%';

  var box = document.getElementById('qOptions');
  box.innerHTML = '';
  // 打乱选项顺序
  var opts = q.options.slice();
  for (var i = opts.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
  }
  for (var i = 0; i < opts.length; i++) {
    (function(opt, ci) {
      var card = document.createElement('div');
      card.className = 'option-card opt-c' + (ci + 1);
      card.innerHTML = '<div class="opt-text">' + opt.text + '</div>';
      card.onclick = function() { chooseOption(opt); };
      box.appendChild(card);
    })(opts[i], i);
  }
}

function chooseOption(opt) {
  // 缩小候选集：取交集
  var newCandidates = [];
  for (var i = 0; i < candidates.length; i++) {
    if (opt.cities.indexOf(candidates[i]) !== -1) {
      newCandidates.push(candidates[i]);
    }
  }
  // 如果交集为空（选项里的城市都不在候选集里），保持候选集不变
  if (newCandidates.length > 0) candidates = newCandidates;
  currentQIndex++;
  renderQuestion();
}

function showResult() {
  var city;
  if (candidates.length === 1) {
    city = candidates[0];
  } else {
    // 多个候选，随机选一个
    city = candidates[Math.floor(Math.random() * candidates.length)];
  }
  var r = results[city];
  document.getElementById('rEmoji').textContent = r.emoji;
  document.getElementById('rCity').textContent = city;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rFact').textContent = "方言小知识：" + r.fact;
  document.getElementById('progressFill').style.width = '100%';
  showView('view-result');
}

function restart() {
  showView('view-start');
}
