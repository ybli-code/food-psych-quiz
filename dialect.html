// 游戏逻辑
var cand=[], used=[], qi=0, total=7;
function showView(id){var v=document.querySelectorAll('.view');for(var i=0;i<v.length;i++)v[i].classList.remove('active');document.getElementById(id).classList.add('active');}
function startQuiz(){cand=ALL.slice();used=[];qi=0;total=6+Math.floor(Math.random()*3);renderQ();showView('vq');}
function pickQ(){
  var buckets={1:[],2:[],3:[]};
  for(var i=0;i<bank.length;i++){
    if(used.indexOf(i)===-1){
      var q=bank[i],overlap=0;
      for(var o=0;o<q.o.length;o++){
        for(var c=0;c<q.o[o].c.length;c++){
          if(cand.indexOf(q.o[o].c[c])!==-1){overlap++;break;}
        }
      }
      if(overlap>=2)buckets[q.l].push(i);
    }
  }
  var pl;
  if(cand.length>8)pl=1;else if(cand.length>=4)pl=2;else pl=3;
  var pool=buckets[pl];
  if(pool.length===0){pool=buckets[Math.min(pl+1,3)];if(pool.length===0)pool=buckets[1].concat(buckets[2],buckets[3]);}
  if(pool.length===0)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function renderQ(){
  if(qi>=total||cand.length<=1){showR();return;}
  var idx=pickQ();
  if(idx===null){showR();return;}
  used.push(idx);
  var q=bank[idx];
  document.getElementById('qt').textContent="第 "+(qi+1)+" 题 / 共 "+total+" 题";
  document.getElementById('qe').textContent=q.e;
  document.getElementById('q2').textContent=q.q;
  document.getElementById('pf').style.width=((qi+1)/total*100)+'%';
  var box=document.getElementById('op');
  box.innerHTML='';
  var opts=q.o.slice();
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}
  for(var i=0;i<opts.length;i++){
    (function(opt,ci){
      var card=document.createElement('div');
      card.className='oc c'+(ci+1);
      card.innerHTML='<div class="ot">'+opt.t+'</div>';
      card.onclick=function(){choose(opt);};
      box.appendChild(card);
    })(opts[i],i);
  }
}
function choose(opt){
  var nc=[];
  for(var i=0;i<cand.length;i++){if(opt.c.indexOf(cand[i])!==-1)nc.push(cand[i]);}
  if(nc.length>0)cand=nc;
  qi++;
  renderQ();
}
function showR(){
  var city;
  if(cand.length===1)city=cand[0];
  else city=cand[Math.floor(Math.random()*cand.length)];
  var r=results[city];
  document.getElementById('re').textContent=r.e;
